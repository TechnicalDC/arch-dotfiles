# Luciole colors, rendered by a Noctalia template.
#
# Add to ~/.config/noctalia/config.toml:
#
#   [theme.templates.user.luciole]
#   input_path  = "/usr/share/luciole/templates/colors.toml"   # <prefix>/share/... for local builds
#   output_path = "$XDG_CONFIG_HOME/luciole/colors.toml"
#
# Luciole reloads the rendered file as soon as it is written.

[colors]
primary = "#33b1ff"
on_primary = "#161616"
primary_container = "#1e445b"
on_primary_container = "#3eb4ff"
secondary = "#42be65"
on_secondary = "#161616"
secondary_container = "#23482d"
on_secondary_container = "#46c268"
tertiary = "#be95ff"
on_tertiary = "#161616"
tertiary_container = "#483c5b"
on_tertiary_container = "#c19aff"
error = "#ee5396"
on_error = "#161616"
error_container = "#56283c"
on_error_container = "#ff6ca8"
surface = "#000000"
on_surface = "#f2f4f8"
on_surface_variant = "#dde1e6"
surface_container_low = "#0e0e0e"
surface_container = "#171717"
surface_container_high = "#212121"
surface_container_highest = "#2a2a2a"
outline_variant = "#525252"
shadow = "#000000"
scrim = "#000000"
hover = "#78a9ff"
on_hover = "#161616"
