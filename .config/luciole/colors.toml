# Luciole colors, rendered by a Noctalia template.
#
# Add to ~/.config/noctalia/config.toml:
#
#   [theme.templates.user.luciole]
#   input_path  = "/usr/share/luciole/templates/colors.toml"   # <prefix>/share/... for local builds
#   output_path = "$XDG_CONFIG_HOME/luciole/colors.toml"
#
# Luciole reloads the rendered file as soon as it is written.

[colors]
primary = "#37f499"
on_primary = "#171928"
primary_container = "#276154"
on_primary_container = "#37f499"
secondary = "#04d1f9"
on_secondary = "#171928"
secondary_container = "#185771"
on_secondary_container = "#15d5fd"
tertiary = "#a48cf2"
on_tertiary = "#171928"
tertiary_container = "#48426f"
on_tertiary_container = "#bcaaff"
error = "#f16c75"
on_error = "#171928"
error_container = "#5f3849"
on_error_container = "#ff9094"
surface = "#000000"
on_surface = "#ebfafa"
on_surface_variant = "#abb4da"
surface_container_low = "#050719"
surface_container = "#0a1022"
surface_container_high = "#12192f"
surface_container_highest = "#1a213a"
outline_variant = "#3b4261"
shadow = "#414868"
scrim = "#000000"
hover = "#a48cf2"
on_hover = "#171928"
