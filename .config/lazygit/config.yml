gui:
  theme:
    activeBorderColor:
      - "#95cdf7"
      - bold
    inactiveBorderColor:
      - "#b7c9d9"
    searchingActiveBorderColor:
      - "#cec0e8"
      - bold
    optionsTextColor:
      - "#c1c7ce"
    selectedLineBgColor:
      - "#262a2e"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#c1c7ce"
    cherryPickedCommitBgColor:
      - "#cec0e8"
    markedBaseCommitFgColor:
      - "#cec0e8"
    markedBaseCommitBgColor:
      - "#ffb4ab"
    unstagedChangesColor:
      - "#ffb4ab"
    defaultFgColor:
      - "#e0e3e8"
  border: rounded
  showIcons: false
  spinner:
    frames:
     - '⠋'
     - '⠙'
     - '⠹'
     - '⠸'
     - '⠼'
     - '⠴'
     - '⠦'
     - '⠧'
     - '⠇'
     - '⠏'
git:
  parseEmoji: true
