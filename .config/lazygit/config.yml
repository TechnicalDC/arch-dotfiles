gui:
  theme:
    activeBorderColor:
      - "#aaaaaa"
      - bold
    inactiveBorderColor:
      - "#a7a7a7"
    searchingActiveBorderColor:
      - "#cccccc"
      - bold
    optionsTextColor:
      - "#636363"
    selectedLineBgColor:
      - "#111111"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#636363"
    cherryPickedCommitBgColor:
      - "#cccccc"
    markedBaseCommitFgColor:
      - "#cccccc"
    markedBaseCommitBgColor:
      - "#dddddd"
    unstagedChangesColor:
      - "#dddddd"
    defaultFgColor:
      - "#828282"
  border: rounded
  showIcons: false
  spinner:
    frames:
     - '⠋'
     - '⠙'
     - '⠹'
     - '⠸'
     - '⠼'
     - '⠴'
     - '⠦'
     - '⠧'
     - '⠇'
     - '⠏'
git:
  parseEmoji: true
