gui:
  theme:
    activeBorderColor:
      - "#b2c5ff"
      - bold
    inactiveBorderColor:
      - "#c0c6dd"
    searchingActiveBorderColor:
      - "#e1bbdc"
      - bold
    optionsTextColor:
      - "#c5c6d0"
    selectedLineBgColor:
      - "#272830"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#c5c6d0"
    cherryPickedCommitBgColor:
      - "#e1bbdc"
    markedBaseCommitFgColor:
      - "#e1bbdc"
    markedBaseCommitBgColor:
      - "#ffb4ab"
    unstagedChangesColor:
      - "#ffb4ab"
    defaultFgColor:
      - "#e3e2e9"
  border: rounded
  showIcons: false
  spinner:
    frames:
     - '⠋'
     - '⠙'
     - '⠹'
     - '⠸'
     - '⠼'
     - '⠴'
     - '⠦'
     - '⠧'
     - '⠇'
     - '⠏'
git:
  parseEmoji: true
